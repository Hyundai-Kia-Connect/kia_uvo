name: Release
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * Sun"
concurrency:
  group: release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # master's ruleset requires status checks, so github.token can't
          # push the version-bump commit. BUMP_TOKEN's identity must be on
          # the ruleset's bypass list.
          token: ${{ secrets.BUMP_TOKEN }}
          # release_notes.py reads the bump commits since the last release tag.
          fetch-depth: 0

      - name: Gets semantic release info
        id: semantic_release_info
        uses: jossef/action-semantic-release-info@277fc891fc5ac40ed0e8d6bf59a0e24a25dfdeac # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Add API changes to the release notes
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        env:
          NOTES: ${{ steps.semantic_release_info.outputs.notes }}
        run: printf '%s' "$NOTES" | python3 scripts/release_notes.py > "$RUNNER_TEMP/release_notes.md"
      - name: Update Version and Commit
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        run: |
          echo "Version: ${{steps.semantic_release_info.outputs.version}}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${{steps.semantic_release_info.outputs.version}}\"/g" custom_components/kia_uvo/manifest.json
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: bumping version to ${{steps.semantic_release_info.outputs.version}}"
          git tag ${{ steps.semantic_release_info.outputs.git_tag }}

      - name: Push changes
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.BUMP_TOKEN }}
          tags: true

      - name: Create GitHub Release
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ steps.semantic_release_info.outputs.git_tag }}
          name: ${{ steps.semantic_release_info.outputs.git_tag }}
          bodyFile: ${{ runner.temp }}/release_notes.md
          draft: false
          prerelease: false

      - name: Delete beta releases
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("-beta\\."))) | .tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag -y
