name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  validate-mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install mypy and dependencies
        # hyundai_kia_connect_api is read from manifest.json so mypy checks
        # against the library version the integration ships with;
        # homeassistant pin tracks the current stable release.
        run: |
          pip install mypy==2.3.1 homeassistant==2026.9.2 \
            "$(jq -r '.requirements[0]' custom_components/kia_uvo/manifest.json)"
      - name: Run mypy
        # Whole custom_components/kia_uvo/ package is strict-clean; this also
        # covers new files automatically.
        run: |
          mypy --strict --ignore-missing-imports \
            custom_components/kia_uvo/

  validate-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install test dependencies
        # hyundai_kia_connect_api is read from manifest.json so the tests
        # always run against the library version the integration ships with.
        run: |
          pip install homeassistant==2026.9.2 pytest==9.1.1 pytest-asyncio==1.4.0 \
            "$(jq -r '.requirements[0]' custom_components/kia_uvo/manifest.json)"
      - name: Run pytest
        run: pytest

  # Separate from validate-pytest so coverage shows as its own "Coverage"
  # check, with the report on the run's summary page.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install test dependencies
        run: |
          pip install homeassistant==2026.9.2 pytest==9.1.1 pytest-asyncio==1.4.0 \
            pytest-cov==7.1.0 \
            "$(jq -r '.requirements[0]' custom_components/kia_uvo/manifest.json)"
      - name: Run pytest with coverage
        run: pytest --cov=custom_components/kia_uvo --cov-report=term-missing --cov-report=xml
      - name: Write coverage summary
        env:
          CODECOV_URL: ${{ github.event_name == 'pull_request' && format('https://app.codecov.io/gh/{0}/pull/{1}', github.repository, github.event.pull_request.number) || format('https://app.codecov.io/gh/{0}/commit/{1}', github.repository, github.sha) }}
        run: |
          {
            echo "## Coverage: $(coverage report --format=total)%"
            echo
            echo "Full report: [Codecov]($CODECOV_URL)"
            echo
            coverage report --format=markdown --skip-covered
          } >> "$GITHUB_STEP_SUMMARY"
      # Fork PRs have no secrets; the action then uploads tokenless.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
