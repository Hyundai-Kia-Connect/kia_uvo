[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "BLE001",  # except Exception — resilience pattern (ConfigEntryNotReady catch-all, force_refresh catch-all) — permanent
  "DTZ011",  # date.today(); deferred to the tz-aware migration PR
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.kia_uvo"]
combine-as-imports = true
split-on-trailing-comma = false
